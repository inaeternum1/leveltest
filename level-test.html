<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 레벨 테스트</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f8;--card:#fff;--ink:#1b2a49;--sub:#5b6b86;--line:#d3dde9;--ok:#1f9d6b;--no:#d6455d;--k:#d6455d;--e:#2f6fde;--m:#1f9d6b;--s:#d98200;--l:#7b4fd6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a2b;--card:#1b2640;--ink:#eaf0fb;--sub:#9fb0cd;--line:#2f3d5c;--ok:#4cd39d;--no:#ff7d92;--k:#ff7d92;--e:#7aa5ff;--m:#4cd39d;--s:#ffb43d;--l:#b79cff}}
:root[data-theme="dark"]{--bg:#121a2b;--card:#1b2640;--ink:#eaf0fb;--sub:#9fb0cd;--line:#2f3d5c;--ok:#4cd39d;--no:#ff7d92;--k:#ff7d92;--e:#7aa5ff;--m:#4cd39d;--s:#ffb43d;--l:#b79cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:17px;line-height:1.6}
h1,h2,h3,.jua{font-family:'Jua','Gowun Dodum','Apple SD Gothic Neo',sans-serif;font-weight:400}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:2rem;line-height:1.25;margin:12px 0 6px}
h2.sec{font-size:1.35rem;margin:22px 0 8px}
.lead{color:var(--sub);margin:0 0 18px}
button:focus-visible,select:focus-visible{outline:3px solid var(--e);outline-offset:2px}
.all{width:100%;margin-top:14px;padding:16px;border:0;border-radius:18px;background:var(--ink);color:var(--bg);font:inherit;font-family:'Jua',sans-serif;font-size:1.2rem;cursor:pointer}
.all:disabled{opacity:.4;cursor:default}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 18px}
.bar i{display:block;height:100%;background:var(--c);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--sub);font-size:.9rem}
.q{background:var(--card);border-radius:20px;padding:20px;border-left:8px solid var(--c)}
.q h2{font-size:1.25rem;line-height:1.5;margin:0 0 6px;white-space:pre-line}
.tag{display:inline-block;font-size:.8rem;padding:2px 10px;border-radius:99px;background:var(--bg);color:var(--sub);margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;margin-top:10px;padding:14px 16px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;font:inherit;cursor:pointer}
.opt.pick{border-color:var(--e);background:color-mix(in srgb,var(--e) 16%,var(--card))}
.opt.dk{border-style:dashed;color:var(--sub);margin-top:16px;text-align:center}
.opt.dk.pick{border-style:solid;border-color:var(--s);background:color-mix(in srgb,var(--s) 18%,var(--card));color:var(--ink)}
.next{margin-top:14px;width:100%;padding:14px;border:0;border-radius:14px;background:var(--c);color:#fff;font:inherit;font-family:'Jua',sans-serif;font-size:1.15rem;cursor:pointer}
.next:disabled{opacity:.4;cursor:default}
.res{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;border-left:8px solid var(--c)}
.res h3{margin:0;font-size:1.3rem;color:var(--c);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.weak{color:var(--sub);font-size:.92rem}
.wrong{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;font-size:.95rem;overflow-wrap:anywhere}
.home{background:none;border:2px solid var(--ink);color:var(--ink);padding:12px;border-radius:14px;width:100%;font:inherit;cursor:pointer;margin-top:8px}
label{display:block;margin:6px 0 4px;color:var(--sub)}
input,textarea,select{width:100%;padding:14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}
textarea.code{word-break:break-all;font-size:.85rem}
.grades{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.gbtn{padding:16px 8px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);font:inherit;font-family:'Jua',sans-serif;font-size:1.25rem;cursor:pointer}
.gbtn.pick{border-color:var(--e);background:color-mix(in srgb,var(--e) 16%,var(--card))}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:2px solid var(--c);color:var(--c);border-radius:99px;padding:0 10px;font-size:.9rem}
summary{cursor:pointer;color:var(--sub);margin-top:6px}
.psg{background:var(--bg);padding:14px 16px;border-radius:12px;white-space:pre-line;line-height:1.85;margin:4px 0 14px;font-size:1rem}
.fig{display:flex;justify-content:center;margin:4px 0 12px;color:var(--ink)}.fig svg{width:100%;max-width:300px;height:auto}
.fr{display:inline-flex;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.15}
.fr .w{margin-right:.12em}
.fx{display:inline-flex;flex-direction:column;align-items:center;font-size:.86em}
.fx span{padding:0 .22em}
.fx span:first-child{border-bottom:1.5px solid currentColor;padding-bottom:.08em}
.fx span:last-child{padding-top:.08em}
.listen{display:flex;gap:8px;margin:2px 0 12px}
.listen button{flex:1;padding:14px 8px;border:2px solid var(--l);border-radius:14px;background:color-mix(in srgb,var(--l) 12%,var(--card));color:var(--ink);font:inherit;font-family:'Jua',sans-serif;font-size:1.1rem;cursor:pointer}
.listen button.slow{flex:.7;background:var(--card)}
.listen button.on{background:var(--l);color:#fff}
.script{background:color-mix(in srgb,var(--l) 10%,var(--card));border-radius:12px;padding:10px 14px;margin:6px 0;white-space:pre-line;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92rem}
.mini{border:1.5px solid var(--l);background:none;color:var(--ink);border-radius:99px;padding:2px 12px;font:inherit;font-size:.85rem;cursor:pointer;margin-left:6px}
.numin{font-size:1.5rem;text-align:center;letter-spacing:.05em;margin-top:6px}
.mine a{color:var(--e)}
.mine li{margin:4px 0}
.box{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;border-radius:99px;padding:2px 12px;font-size:.85rem;background:var(--bg);color:var(--sub)}
.pill.on{background:color-mix(in srgb,var(--ok) 20%,var(--card));color:var(--ok)}
.rel{border:0;border-radius:14px;padding:14px;width:100%;font:inherit;font-family:'Jua',sans-serif;font-size:1.1rem;cursor:pointer;margin-top:10px;background:var(--ok);color:#fff}
.rel.off{background:none;border:2px solid var(--no);color:var(--no)}
/* 최근 7일 제출 O/X */
.wk{background:var(--card);border-radius:18px;padding:12px 10px 10px;margin:4px 0 10px}
.wk-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 4px 8px;font-size:.92rem;color:var(--sub)}
.wk-h b{font-family:'Jua',sans-serif;font-weight:400;color:var(--ink);font-size:1.05rem}
.wk-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wk-c{text-align:center;border-radius:10px;padding:5px 0 4px;background:var(--bg);line-height:1.2}
.wk-c.today{outline:2px solid var(--e);outline-offset:-2px}
.wk-d{display:block;font-size:.72rem;color:var(--sub);white-space:nowrap}
.wk-m{display:block;font-family:'Jua',sans-serif;font-size:1.35rem;margin-top:2px}
.mk-o{color:var(--ok)}.mk-x{color:var(--no)}.mk-n,.mk-w{color:var(--sub)}
.mk-w{font-family:'Gowun Dodum',sans-serif;font-size:.8rem!important;padding:5px 0 3px}
.wkt{width:100%;border-collapse:collapse;font-size:.85rem;table-layout:fixed}
.wkt th,.wkt td{text-align:center;padding:5px 2px;border-bottom:1px solid var(--line)}
.wkt th{font-weight:400;color:var(--sub);font-size:.72rem;line-height:1.2}
.wkt th:first-child,.wkt td:first-child{text-align:left;width:5.2em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wkt td{font-family:'Jua',sans-serif;font-size:1.05rem}
.wkt td:first-child{font-family:inherit;font-size:.9rem}
.wkt .today{background:color-mix(in srgb,var(--e) 10%,transparent)}
/* 스도쿠 */
.sdk{display:grid;grid-template-columns:repeat(9,1fr);width:100%;max-width:400px;margin:8px auto 10px;border:2.5px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--card);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.sc{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--card);color:var(--e);font:inherit;font-family:'Jua',sans-serif;font-size:clamp(1.05rem,5.4vw,1.5rem);padding:0;cursor:pointer;position:relative;min-width:0}
.sc.c3{border-right:2px solid var(--ink)}.sc.r3{border-bottom:2px solid var(--ink)}
.sc.c9{border-right:0}.sc.r9{border-bottom:0}
.sc.gv{color:var(--ink);cursor:default}
.sc.pe{background:color-mix(in srgb,var(--e) 7%,var(--card))}
.sc.sm{background:color-mix(in srgb,var(--e) 18%,var(--card))}
.sc.on{background:color-mix(in srgb,var(--e) 32%,var(--card))}
.sc.bad{color:var(--no);background:color-mix(in srgb,var(--no) 14%,var(--card))}
.sc .nt{position:absolute;inset:1px;display:grid;grid-template-columns:repeat(3,1fr);font-family:'Gowun Dodum',sans-serif;font-size:clamp(.45rem,2.1vw,.62rem);line-height:1;color:var(--sub)}
.sc .nt i{font-style:normal;display:flex;align-items:center;justify-content:center}
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;max-width:400px;margin:0 auto}
.pad button{padding:10px 0;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-family:'Jua',sans-serif;font-size:1.25rem;cursor:pointer;min-width:0}
.pad button.dn{opacity:.35}
.pad2{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:400px;margin:6px auto 0}
.pad2 button{padding:11px 4px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.pad2 button.on{border-color:var(--m);background:color-mix(in srgb,var(--m) 16%,var(--card))}
.sdk-st{text-align:center;color:var(--sub);font-size:.92rem;margin:8px 0 0;min-height:1.4em}
.sdm{display:inline-grid;grid-template-columns:repeat(9,1.35em);border:2px solid var(--ink);margin:6px 0;font-size:.85rem;line-height:1.35em;text-align:center;vertical-align:top}
.sdm span{border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:1.35em}
.sdm .c3{border-right:2px solid var(--ink)}.sdm .r3{border-bottom:2px solid var(--ink)}.sdm .c9{border-right:0}.sdm .r9{border-bottom:0}
.sdm .g{color:var(--sub)}.sdm .ok{color:var(--ok);font-weight:700}.sdm .x{color:var(--no);font-weight:700;background:color-mix(in srgb,var(--no) 14%,transparent)}
</style>
</head>
<body>
<main id="app"></main>
<script>
// 새 버전 자동 반영: 폰이 예전 화면을 저장해 두었으면 version.txt와 비교해 한 번만 새로 불러온다.
const BUILD='202610242230';
(async()=>{try{const r=await fetch('version.txt?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const v=(await r.text()).trim();
 if(v&&v!==BUILD&&sessionStorage.getItem('lt_reloaded')!==v){sessionStorage.setItem('lt_reloaded',v);location.replace(location.pathname+'?v='+v+location.hash)}}catch(e){}})();
const API='https://inulbquzdxzinpidgwhh.supabase.co/functions/v1/api',PAGE='level';
const SUBJ={k:{n:'국어',c:'var(--k)'},e:{n:'영어',c:'var(--e)'},l:{n:'영어 듣기',c:'var(--l)'},m:{n:'수학',c:'var(--m)'},s:{n:'과학',c:'var(--s)'}};
/* ---------- 영어 듣기: 앱은 안드로이드 음성(LTApp.speak), 브라우저는 speechSynthesis ---------- */
const TTS=(()=>{
 let voice=null;
 const web='speechSynthesis' in window;
 const pick=()=>{try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/^en[-_]US/i.test(v.lang)&&/google|samantha|female|aria|jenny/i.test(v.name))||vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}catch(e){}};
 if(web){pick();try{speechSynthesis.addEventListener('voiceschanged',pick)}catch(e){}}
 const native=()=>!!(window.LTApp&&typeof LTApp.speak==='function');
 // 'A: …' / 'B: …' 줄은 두 사람 목소리(높낮이)로 구분, 표시 없는 줄은 한 사람
 const lines=s=>String(s||'').split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^([AB])\s*:\s*(.*)$/);return{b:!!m&&m[1]==='B',t:m?m[2]:l}});
 return{
  ok:()=>native()||web,
  stop(){try{if(native()&&LTApp.stopSpeak)LTApp.stopSpeak();else if(web)speechSynthesis.cancel()}catch(e){}},
  play(script,slow){
   this.stop();const L=lines(script),rate=slow?0.6:0.9;
   if(native()){LTApp.speak(JSON.stringify(L.map(x=>({t:x.t,p:x.b?1.35:0.95}))),rate);return true}
   if(!web)return false;
   L.forEach(x=>{const u=new SpeechSynthesisUtterance(x.t);u.lang='en-US';if(voice)u.voice=voice;u.rate=rate;u.pitch=x.b?1.35:0.95;speechSynthesis.speak(u)});
   return true;
  }
 };
})();
function hear(slow){const q=set&&set.questions[idx];if(!q||!q.script)return;if(!TTS.play(q.script,slow)){const m=document.getElementById('tts-msg');if(m)m.textContent='이 기기에서는 소리를 낼 수 없어요. 선생님께 말씀드려 주세요.'}}
function hearText(t){TTS.play(t,false)}

const $=document.getElementById('app');
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// [[4/5]] -> 세로 분수, [[2 3/7]] -> 대분수 (교과서 표기)
const rich=t=>esc(t).replace(/\[\[(?:([^\[\]\/\s]{1,6}) )?([^\[\]\/\s]{1,6})\/([^\[\]\/\s]{1,6})\]\]/g,(m,w,a,b)=>`<span class="fr" role="math" aria-label="${w?w+'와 ':''}${b}분의 ${a}">${w?`<span class="w">${w}</span>`:''}<span class="fx" aria-hidden="true"><span>${a}</span><span>${b}</span></span></span>`);
const fmt=d=>d?(+d.slice(5,7))+'월 '+(+d.slice(8,10))+'일':'';
const when=at=>new Date(at).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'});
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec=t=>JSON.parse(decodeURIComponent(escape(atob(t.trim()))));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const getJSON=async u=>{const r=await fetch(u);let j=null;try{j=await r.json()}catch(e){}return{status:r.status,ok:r.ok,j}};
const postJSON=async(u,b)=>{const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});let j=null;try{j=await r.json()}catch(e){}return{status:r.status,ok:r.ok,j}};

let name='',grade=0,set=null,idx=0,sel=[],txt={};

/* ---------- 최근 7일 제출 O/X ---------- */
const WD='일월화수목금토';
const md=d=>`${+d.slice(5,7)}/${+d.slice(8,10)}`;
const wd=d=>WD[new Date(Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10))).getUTCDay()];
// O = 제출, X = 문제가 있었는데 안 냄, – = 그날 문제 없음, 오늘 아직 안 냈으면 '아직'
const mark=(has,done,isToday)=>done?['O','o']:!has?['–','n']:isToday?['아직','w']:['X','x'];
let wkSeq=0;
async function loadWeek(){
 const box=document.getElementById('wk');if(!box)return;
 const nm=(document.getElementById('nm')?.value||name||'').trim();
 if(!nm||!grade){box.innerHTML='';return}
 const my=++wkSeq;
 let r;try{r=await getJSON(`${API}/history?grade=${grade}&name=${encodeURIComponent(nm)}`)}catch(e){r=null}
 if(my!==wkSeq||!document.getElementById('wk'))return;
 if(!r||!r.ok||!r.j||!r.j.days){box.innerHTML='';return}
 const days=r.j.days,n=days.filter(x=>x.done).length,due=days.filter(x=>x.set).length;
 box.innerHTML=`<div class="wk" aria-label="최근 7일 제출 기록"><div class="wk-h"><b>${esc(nm)} · ${grade}학년 최근 7일</b><span>${n}/${due}일 제출</span></div>
 <div class="wk-g">${days.map(x=>{const t=x.date===r.j.today,[m,c]=mark(x.set,x.done,t);return`<div class="wk-c${t?' today':''}"><span class="wk-d">${md(x.date)}<br>${wd(x.date)}</span><span class="wk-m mk-${c}" aria-label="${c==='o'?'제출':c==='x'?'안 냄':c==='w'?'아직 안 냄':'문제 없음'}">${m}</span></div>`}).join('')}</div></div>`;
}
function weekTable(w,g){
 if(!w||!w.days)return'';
 const has=new Set(w.sets.filter(x=>x.grade===g).map(x=>x.date));
 const done=new Set(w.subs.filter(x=>x.grade===g).map(x=>x.name+'\u0000'+x.date));
 const names=[...new Set(w.subs.filter(x=>x.grade===g).map(x=>x.name))].sort((a,b)=>a.localeCompare(b,'ko'));
 const head=`<tr><th>이름</th>${w.days.map(d=>`<th class="${d===w.today?'today':''}">${md(d)}<br>${wd(d)}</th>`).join('')}</tr>`;
 const rows=names.map(nm=>`<tr><td title="${esc(nm)}">${esc(nm)}</td>${w.days.map(d=>{const[m,c]=mark(has.has(d),done.has(nm+'\u0000'+d),d===w.today);return`<td class="mk-${c}${d===w.today?' today':''}">${m}</td>`}).join('')}</tr>`).join('');
 return`<div class="box"><div class="row" style="justify-content:space-between"><b>${g}학년 최근 7일 제출</b><span class="weak">O 제출 · X 안 냄 · – 문제 없음</span></div>
 ${names.length?`<table class="wkt" style="margin-top:8px">${head}${rows}</table>`:'<p class="weak" style="margin:8px 0 0">최근 7일 동안 제출한 학생이 없어요.</p>'}</div>`;
}

/* ---------- 학생: 시작 화면 ---------- */
function home(){
 name=store.get('lt_name','');grade=store.get('lt_grade',0);
 tellApp();
 const mine=store.get('lt_mine',[]).slice(0,10);
 $.innerHTML=`<div id="wk"></div><h1 class="jua">오늘의<br>레벨 테스트</h1>
 <p class="lead">국어·영어·영어 듣기·수학(사고력·스도쿠)·과학 14문제예요. 영어 듣기는 소리를 켜거나 이어폰을 끼고 풀어요. 새 문제는 매일 오후 3시에 올라와요. 다 풀고 제출하면, 선생님이 확인한 뒤 정답과 해설을 볼 수 있어요.<br><b>모르는 문제는 찍지 말고 '잘 몰라요'를 눌러 주세요.</b> 그래야 선생님이 어디를 도와줄지 알 수 있어요.</p>
 <label for="nm">이름</label><input id="nm" maxlength="20" placeholder="이름을 입력하세요" autocomplete="off" value="${esc(name)}" onchange="loadWeek()">
 <label>학년</label><div class="grades">${[4,5].map(g=>`<button class="gbtn ${grade===g?'pick':''}" onclick="pickGrade(${g})">${g}학년</button>`).join('')}</div>
 <button class="all" onclick="start()">시작하기</button>
 <button class="home" onclick="location.hash='#demo'">▶ 연습 문제: 영어 듣기·사고력 수학·스도쿠 (저장 안 돼요)</button>
 ${window.LTApp&&LTApp.canNotify&&LTApp.canNotify()?`<button class="home" onclick="LTApp.testNotify()">🔔 알림 테스트 (매일 오후에 새 문제 알림이 와요)</button>`:''}
 <p id="msg" class="lead" role="status" style="margin-top:10px"></p>
 ${mine.length?`<h2 class="sec">내 결과</h2><div class="box mine"><ul style="margin:0;padding-left:18px">${mine.map(m=>`<li><a href="#r=${m.rid}">${fmt(m.date)} ${m.grade}학년 · ${esc(m.name)}</a></li>`).join('')}</ul><div class="weak" style="margin-top:6px">선생님이 확인하면 정답과 해설이 열려요.</div></div>`:''}`;
 loadWeek();

// 학생 앱: 이 폰의 학생 이름·학년을 알려 두면 선생님이 이 학생에게만 보낸 알림도 받는다
function tellApp(){try{if(name&&grade&&window.LTApp&&LTApp.setIdentity)LTApp.setIdentity(name,grade)}catch(e){}}
function pickGrade(g){grade=g;store.set('lt_grade',g);document.querySelectorAll('.gbtn').forEach(b=>b.classList.toggle('pick',b.textContent===g+'학년'));loadWeek()}
async function start(){
 const msg=document.getElementById('msg');
 name=document.getElementById('nm').value.trim();
 if(!name){document.getElementById('nm').focus();msg.textContent='이름을 입력해 주세요.';return}
 if(!grade){msg.textContent='학년을 골라 주세요.';return}
 store.set('lt_name',name);tellApp();
 msg.textContent='문제를 불러오는 중…';
 try{
  const r=await getJSON(`${API}/set?grade=${grade}`);
  if(r.status===404){msg.textContent='아직 올라온 문제가 없어요. 오후 3시 이후에 다시 들어와 주세요.';return}
  if(!r.ok)throw 0;
  set=r.j;
 }catch(e){msg.textContent='문제를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.';return}
 const done=store.get('lt_mine',[]).find(m=>m.date===set.date&&m.grade===grade&&m.name===name);
 if(done){
  $.innerHTML=`<h1 class="jua">이미 제출했어요</h1><p class="lead">${esc(name)}님은 ${fmt(set.date)} ${grade}학년 문제를 이미 제출했어요. 새 문제는 오후 3시에 올라와요.</p>
  <button class="all" onclick="location.hash='#r=${done.rid}'">내 결과 보기</button><button class="home" onclick="home()">처음으로</button>`;return;
 }
 idx=0;sel=[];txt={};show();
}
function ready(){const q=set.questions[idx];if(sel[idx]===-2)return true;if(q.sudoku)return sdkLeft(q,txt[idx]).mine>0;return (q.open||q.num)?(txt[idx]||'').trim().length>0:sel[idx]!==undefined}

/* ---------- 스도쿠: 판을 직접 채우기. txt[idx]에 81자(0=빈칸), 메모는 이 폰에만 ---------- */
const SD={cell:-1,memo:false,notes:{},warned:false};
const sdkLeft=(q,g)=>{g=g||q.sudoku;let left=0,mine=0;for(let i=0;i<81;i++){if(q.sudoku[i]!=='0')continue;if(g[i]==='0')left++;else mine++}return{left,mine}};
const sdkPeers=i=>{const r=Math.floor(i/9),c=i%9,br=r-r%3,bc=c-c%3,s=new Set();for(let k=0;k<9;k++){s.add(r*9+k);s.add(k*9+c);s.add((br+Math.floor(k/3))*9+bc+k%3)}s.delete(i);return s};
const SDK_PEERS=[...Array(81)].map((_,i)=>sdkPeers(i));
const sdkKey=()=>set&&!set.demo?`lt_sdk_${set.date}_${grade}`:'';
function sdkInit(q){
 if(txt[idx]!==undefined&&txt[idx].length===81)return;
 const k=sdkKey(),d=k&&store.get(k,null);
 if(d&&d.p===q.sudoku&&typeof d.g==='string'&&d.g.length===81){txt[idx]=d.g;SD.notes[idx]=d.n||{}}else{txt[idx]=q.sudoku;SD.notes[idx]={}}
}
function sdkSave(){const k=sdkKey();if(k)store.set(k,{p:set.questions[idx].sudoku,g:txt[idx],n:SD.notes[idx]||{}})}
function sdkBody(q){
 sdkInit(q);
 return `<div class="sdk" id="sdk" role="grid" aria-label="스도쿠 판"></div>
 <div class="pad" id="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button onclick="sdkPut(${d})" aria-label="${d}">${d}</button>`).join('')}</div>
 <div class="pad2"><button id="memo" onclick="SD.memo=!SD.memo;sdkDraw()" aria-pressed="false">✏️ 메모</button><button onclick="sdkPut(0)">지우기</button></div>
 <p class="sdk-st" id="sdk-st" role="status"></p>
 <p class="weak" style="margin:4px 0 0">칸을 누르고 아래 숫자를 눌러요. <b>메모</b>를 켜면 들어갈 수 있는 숫자를 작게 적어 둘 수 있어요. 같은 줄·상자에 같은 숫자가 있으면 빨갛게 보여요. 풀던 판은 이 폰에 저장돼요.</p>`;
}
function sdkDraw(){
 const el=document.getElementById('sdk');if(!el)return;
 const q=set.questions[idx],g=txt[idx],nt=SD.notes[idx]||(SD.notes[idx]={}),cur=SD.cell;
 const curD=cur>=0&&g[cur]!=='0'?g[cur]:'';
 const peers=cur>=0?SDK_PEERS[cur]:new Set();
 el.innerHTML=[...Array(81)].map((_,i)=>{
  const r=Math.floor(i/9),c=i%9,v=g[i],gv=q.sudoku[i]!=='0';
  const bad=v!=='0'&&[...SDK_PEERS[i]].some(p=>g[p]===v);
  const cls=['sc',c%3===2&&c<8?'c3':'',c===8?'c9':'',r%3===2&&r<8?'r3':'',r===8?'r9':'',gv?'gv':'',i===cur?'on':curD&&v===curD?'sm':peers.has(i)?'pe':'',bad&&!gv?'bad':''].filter(Boolean).join(' ');
  const inner=v!=='0'?v:(nt[i]&&nt[i].length?`<span class="nt">${[1,2,3,4,5,6,7,8,9].map(d=>`<i>${nt[i].includes(d)?d:''}</i>`).join('')}</span>`:'');
  return `<button class="${cls}" onclick="sdkSel(${i})" aria-label="${r+1}행 ${c+1}열 ${v!=='0'?v:'빈칸'}${gv?' (처음부터 있던 숫자)':''}">${inner}</button>`}).join('');
 const cnt={};for(const ch of g)cnt[ch]=(cnt[ch]||0)+1;
 document.querySelectorAll('#pad button').forEach((b,k)=>b.classList.toggle('dn',(cnt[String(k+1)]||0)>=9));
 const m=document.getElementById('memo');m.classList.toggle('on',SD.memo);m.setAttribute('aria-pressed',SD.memo);m.textContent=SD.memo?'✏️ 메모 켜짐':'✏️ 메모';
 const {left}=sdkLeft(q,g);
 const conflict=[...Array(81)].some((_,i)=>g[i]!=='0'&&[...SDK_PEERS[i]].some(p=>g[p]===g[i]));
 const st=document.getElementById('sdk-st');
 if(!SD.warned)st.textContent=left?`빈칸 ${left}개 남았어요${conflict?' · 빨간 숫자를 다시 살펴보세요':''}`:conflict?'다 채웠지만 빨간 숫자가 있어요. 다시 살펴보세요.':'다 채웠어요! 제출 전에 한 번 더 확인해 보세요.';
 const nx=document.querySelector('.next');if(nx)nx.disabled=!ready();
}
function sdkSel(i){if(set.questions[idx].sudoku[i]!=='0'){SD.cell=i;sdkDraw();return}SD.cell=i;sdkDraw()}
function sdkPut(d){
 const q=set.questions[idx],i=SD.cell;
 if(i<0){document.getElementById('sdk-st').textContent='먼저 빈칸을 눌러 골라요.';return}
 if(q.sudoku[i]!=='0')return;
 const g=txt[idx].split(''),nt=SD.notes[idx]||(SD.notes[idx]={});
 if(d===0){if(g[i]!=='0')g[i]='0';else delete nt[i]}
 else if(SD.memo&&g[i]==='0'){const a=nt[i]||[];nt[i]=a.includes(d)?a.filter(x=>x!==d):[...a,d].sort()}
 else{g[i]=g[i]===String(d)?'0':String(d);if(g[i]!=='0')SDK_PEERS[i].forEach(p=>{if(nt[p])nt[p]=nt[p].filter(x=>x!==d)})}
 txt[idx]=g.join('');SD.warned=false;
 if(sel[idx]===-2){delete sel[idx];document.querySelector('.dk')?.classList.remove('pick')}
 sdkSave();sdkDraw();
}
document.addEventListener('keydown',e=>{
 if(!document.getElementById('sdk')||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
 if(/^[1-9]$/.test(e.key)){sdkPut(+e.key);e.preventDefault()}
 else if(e.key==='Backspace'||e.key==='Delete'||e.key==='0'){sdkPut(0);e.preventDefault()}
 else if(SD.cell>=0&&/^Arrow/.test(e.key)){const r=Math.floor(SD.cell/9),c=SD.cell%9,m={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];SD.cell=((r+m[0]+9)%9)*9+(c+m[1]+9)%9;sdkDraw();e.preventDefault()}
});
// 결과·교사 화면용 작은 판: 처음 숫자(회색), 맞은 칸(초록), 틀린 칸(빨강)
function sdkMini(p,g,sol){
 g=g&&g.length===81?g:p;
 return `<div class="sdm" role="img" aria-label="스도쿠 판">${[...Array(81)].map((_,i)=>{const r=Math.floor(i/9),c=i%9,v=g[i],gv=p[i]!=='0';
  const k=gv?'g':v==='0'?'':!sol?'':v===sol[i]?'ok':'x';
  return `<span class="${[c%3===2&&c<8?'c3':'',c===8?'c9':'',r%3===2&&r<8?'r3':'',r===8?'r9':'',k].filter(Boolean).join(' ')}">${v==='0'?'':v}</span>`}).join('')}</div>`;
}
function sdkScore(q,g){let blank=0,ok=0;for(let i=0;i<81;i++)if(q.sudoku[i]==='0'){blank++;if(g&&g[i]===q.sol[i])ok++}return{blank,ok}}
function show(){
 const qs=set.questions,q=qs[idx],c=SUBJ[q.s].c,last=idx===qs.length-1;
 const dk=`<button class="opt dk ${sel[idx]===-2?'pick':''}" onclick="pick(-2)">잘 몰라요 (찍지 않고 넘기기)</button>`;
 const body=(q.sudoku?sdkBody(q):q.num?`<input id="ans" class="numin" inputmode="decimal" autocomplete="off" maxlength="12" oninput="typed(this.value)" placeholder="답을 숫자로 쓰세요" value="${esc(txt[idx]||'')}"><p class="weak" style="margin:6px 0 0">개, cm 같은 단위는 빼고 숫자만 써요. 종이에 풀어 봐도 좋아요.</p>`
  :q.open?`<textarea id="ans" rows="4" maxlength="300" oninput="typed(this.value)" placeholder="여기에 쓰세요">${esc(txt[idx]||'')}</textarea>`
  :q.options.map((o,i)=>`<button class="opt ${sel[idx]===i?'pick':''}" onclick="pick(${i})">${rich(o)}</button>`).join(''))+dk;
 $.innerHTML=`<div class="meta"><span>${SUBJ[q.s].n} · ${set.demo?'연습':grade+'학년'}</span><span>${idx+1} / ${qs.length}</span></div>
 <div class="bar" style="--c:${c}"><i style="width:${idx/qs.length*100}%"></i></div>
 <div class="q" style="--c:${c}"><span class="tag">${esc(q.unit)}</span>${q.passage?`<div class="psg">${esc(q.passage)}</div>`:''}${q.fig?`<div class="fig">${q.fig}</div>`:''}${q.s==='l'&&q.script?`<div class="listen"><button onclick="hear(false)">▶ 듣기</button><button class="slow" onclick="hear(true)">천천히</button></div><p id="tts-msg" class="weak" role="status" style="margin:-6px 0 8px">${TTS.ok()?'여러 번 들어도 괜찮아요.':'이 기기에서는 소리를 낼 수 없어요. 선생님께 말씀드려 주세요.'}</p>`:''}<h2>${rich(q.q)}</h2>${body}
 <button class="next" style="--c:${c}" ${ready()?'':'disabled'} onclick="next()">${last?'제출하기':'다음 문제'}</button>
 ${idx>0?`<button class="home" onclick="prev()">이전 문제</button>`:''}</div>`;
 if(q.sudoku)sdkDraw();
}
function typed(v){txt[idx]=v;if(v.trim()&&sel[idx]===-2){delete sel[idx];document.querySelector('.dk').classList.remove('pick')}document.querySelector('.next').disabled=!ready()}
function pick(i){sel[idx]=i;if(i===-2&&!set.questions[idx].sudoku)delete txt[idx];show()}
function prev(){TTS.stop();SD.cell=-1;SD.warned=false;if(idx>0){idx--;show();scrollTo(0,0)}}
function next(){
 TTS.stop();const q=set.questions[idx];
 // 스도쿠를 덜 채웠으면 한 번 알려 주고, 한 번 더 누르면 넘어간다
 if(q.sudoku&&sel[idx]!==-2&&!SD.warned){const {left}=sdkLeft(q,txt[idx]);if(left){SD.warned=true;document.getElementById('sdk-st').innerHTML=`<b style="color:var(--no)">아직 빈칸이 ${left}개 있어요.</b> 이대로 넘어가려면 한 번 더 누르세요.`;return}}
 SD.cell=-1;SD.warned=false;
 if(idx<set.questions.length-1){idx++;show();scrollTo(0,0)}else if(set.demo)demoDone();else done()}

/* ---------- 영어 듣기 연습(저장 안 함): 소리·볼륨 확인용 ---------- */
const DEMO=[
 {s:'l',unit:'연습 1 · 바꾼 말',script:"A: Can I have the red cap, please?\nB: Sure. Here you are.\nA: Oh, wait. Not the red one. I want the blue one.\nB: Okay. Here is the blue cap.",q:'대화를 듣고, A가 마지막에 사려는 모자의 색깔을 고르세요.',options:['빨간색','파란색','노란색','초록색'],answer:1,exp:"처음에는 red cap(빨간 모자)을 달라고 했지만, Not the red one. I want the blue one.(빨간 거 말고 파란 걸로 할게요.)이라고 바꿨어요."},

,
 {s:'m',unit:'사고력 · 경우 따지기',num:true,ans:'9',q:'1부터 100까지의 자연수 중에서 각 자리 숫자를 더하면 10이 되는 수는 모두 몇 개인가요?\n(예: 37은 3 + 7 = 10)',exp:'한 자리 수는 가장 커도 9라서 안 돼요. 두 자리 수는 십의 자리가 1~9일 때 일의 자리가 9, 8, …, 1로 하나씩 정해져서 19, 28, 37, 46, 55, 64, 73, 82, 91로 9개예요. 100은 1 + 0 + 0 = 1이에요.'},
 {s:'m',unit:'사고력 · 규칙 찾기',num:true,ans:'46',q:'성냥개비로 정사각형을 옆으로 이어 붙여 만들고 있어요. 정사각형 1개는 4개, 2개는 7개, 3개는 10개가 필요해요. 정사각형 15개를 만들려면 성냥개비는 모두 몇 개 필요한가요?',exp:'첫 정사각형에 4개가 들고, 하나 붙일 때마다 옆 변을 같이 써서 3개씩 늘어나요. 4 + 3 × 14 = 46(개)예요. 3 × 15 + 1로 생각해도 돼요.'},
 {s:'m',unit:'스도쿠',sudoku:'908570000006080500070400080002000703700000008304000200020007030009030400000024609',sol:'918576324246381597573492186852649713761253948394718265425967831689135472137824659',q:'가로줄, 세로줄, 굵은 선으로 나뉜 상자(3×3) 안에 1부터 9까지의 숫자가 한 번씩만 들어가도록 빈칸을 모두 채우세요.',exp:'찍지 않고 생각만으로 풀 수 있는 문제예요. 한 줄이나 한 상자에서 어떤 숫자가 들어갈 자리가 한 곳뿐인 칸, 또는 들어갈 수 있는 숫자가 하나뿐인 칸부터 채워 나가요.'}
];
function demo(){
 set={demo:true,date:'',grade:0,questions:DEMO.map(({answer,exp,sol,...q})=>q)};idx=0;sel=[];txt={};
 show();
 $.insertAdjacentHTML('afterbegin',`<p class="lead" style="margin:0 0 10px">연습 문제예요. 점수는 저장되지 않아요. 영어 듣기 3문제는 <b>▶ 듣기</b>를 눌러 소리를 확인하고, 그다음 2문제는 생각을 많이 해야 하는 사고력 수학, 마지막은 스도쿠예요.</p>`);
}
function demoDone(){
 const t={};DEMO.forEach((q,i)=>{if((q.num||q.sudoku)&&sel[i]!==-2&&txt[i])t[i]=txt[i]});
 const sub={name:name||'연습',setId:'',texts:JSON.stringify(t),answers:DEMO.map((q,i)=>sel[i]===-2||(sel[i]===undefined&&!q.num&&!q.sudoku)?-2:(q.num||q.sudoku)?-1:sel[i])};
 $.innerHTML=`<h1 class="jua">연습 결과</h1><p class="lead">진짜 문제에서도 이렇게 소리가 나와요. 대본과 해설을 확인해 보세요.</p>`+card(sub,DEMO,'student')+
 `<button class="all" onclick="demo()">다시 해 보기</button><button class="home" onclick="location.hash=T.app?'#app':'';if(!T.app)home()">처음으로</button>`;
 scrollTo(0,0);
}
function payload(){
 const p={page:PAGE,name,grade,setId:set.date,answers:set.questions.map((q,i)=>sel[i]===-2?-2:(q.open||q.num||q.sudoku)?-1:sel[i])};
 const t={};for(const k in txt)if(sel[k]!==-2&&String(txt[k]).trim())t[k]=txt[k];
 if(Object.keys(t).length)p.texts=JSON.stringify(t);
 return p;
}
async function done(){
 const p=payload();
 $.innerHTML=`<h1 class="jua">제출하는 중…</h1><p class="lead">잠시만 기다려 주세요.</p>`;scrollTo(0,0);
 try{
  const r=await postJSON(API+'/submit',p);
  if(!r.ok||!r.j||!r.j.rid)throw 0;
  const mine=store.get('lt_mine',[]);mine.unshift({rid:r.j.rid,date:p.setId,grade,name,at:Date.now()});store.set('lt_mine',mine.slice(0,30));
  try{localStorage.removeItem(`lt_sdk_${p.setId}_${grade}`)}catch(e){}
  $.innerHTML=`<h1 class="jua">제출 완료!</h1><p class="lead">${esc(name)}님, 수고했어요. 선생님이 확인(OK)하면 아래 버튼에서 점수와 정답, 해설을 볼 수 있어요.</p>
  <button class="all" onclick="location.hash='#r=${r.j.rid}'">내 결과 보기</button><button class="home" onclick="location.hash='';home()">처음으로</button>`;
 }catch(e){backup(p)}
}
function backup(p){
 $.innerHTML=`<h1 class="jua">전송이 안 됐어요</h1>

/* ---------- 채점 카드 ---------- */
// 사고력(숫자 입력) 채점: 쉼표·띄어쓰기·뒤에 붙은 단위는 무시하고 숫자 값이 같으면 정답
const numEq=(a,b)=>{const x=String(a??'').replace(/[,\s]/g,'').match(/^-?\d+(\.\d+)?/);return !!x&&b!==undefined&&Number(x[0])===Number(b)};
const textsOf=s=>{try{return s?JSON.parse(s):{}}catch(e){return{}}};
function grade1(sub,qs){
 const t=textsOf(sub.texts);
 const rows=qs.map((q,i)=>{const dk=sub.answers[i]===-2;return{q,dk,open:!!q.open,ok:!dk&&(q.sudoku?t[i]===q.sol:q.num?numEq(t[i],q.ans):!q.open&&sub.answers[i]===q.answer),mine:dk?'잘 몰라요':(q.open||q.num||q.sudoku)?t[i]:(q.options||[])[sub.answers[i]]}});
 const mc=rows.filter(r=>!r.open);
 return{rows,mc,tot:mc.filter(r=>r.ok).length,nopen:rows.length-mc.length,nk:rows.filter(r=>r.dk).length};
}
// 스도쿠 답: 내가 채운 판(맞은 칸 초록, 틀린 칸 빨강) + 틀렸으면 정답 판
function sdkAns(r,st){
 const g=r.dk?null:r.mine,{blank,ok}=sdkScore(r.q,g);
 return `${st?'내 판':'학생 판'}: ${r.dk?'잘 몰라요':`빈칸 ${blank}개 중 <b>${ok}개</b> 맞음`}<br>${g?sdkMini(r.q.sudoku,g,r.q.sol):''}${r.ok?'':`<details><summary>정답 판 보기</summary>${sdkMini(r.q.sudoku,r.q.sol,null)}</details>`}`;
}
// mode: 'list'(교사) | 'student'
function card(sub,qs,mode){
 const st=mode==='student';
 if(!qs||sub.answers.length!==qs.length)return `<div class="res" style="--c:var(--no)"><h3>채점할 수 없는 제출</h3><div class="weak">${esc(sub.name)}</div></div>`;
 const g=grade1(sub,qs);
 const per=Object.keys(SUBJ).map(k=>{const r=g.mc.filter(x=>x.q.s===k);return r.length?`<span class="chip" style="--c:${SUBJ[k].c}">${SUBJ[k].n} ${r.filter(x=>x.ok).length}/${r.length}</span>`:''}).join('');
 const items=g.rows.map((r,i)=>`<div class="wrong"><b style="color:${r.dk?'var(--s)':r.open?'var(--e)':r.ok?'var(--ok)':'var(--no)'}">${r.dk?'몰라요':r.open?(st?'선생님 확인':'직접 확인'):r.ok?'정답':'오답'}</b> ${i+1}번 ${SUBJ[r.q.s].n} · ${esc(r.q.unit)}${r.q.script?`<button class="mini" data-s="${esc(r.q.script)}" onclick="hearText(this.dataset.s)">▶ 다시 듣기</button><div class="script">${esc(r.q.script)}</div>`:'<br>'}<span style="white-space:pre-line">${rich(r.q.q)}</span><br>${r.q.sudoku?sdkAns(r,st):`${st?'내 답':'학생 답'}: ${r.open?esc(r.mine??'(미응답)'):rich(r.mine??'(미응답)')}${r.open?`<br>모범 답안: ${rich(r.q.model)}`:r.ok?'':`<br>정답: ${r.q.num?esc(r.q.ans):rich(r.q.options[r.q.answer])}`}`}<br><span class="weak">${rich(r.q.exp)}</span></div>`).join('');
 const info=`${sub.at?when(sub.at)+' 제출 · ':''}${sub.grade?sub.grade+'학년 · ':''}${fmt(sub.setId)} 문제${g.nk?` · 몰라요 ${g.nk}개`:''}${g.nopen?` · 서술형 ${g.nopen}문항은 ${st?'선생님이 확인해요':'직접 확인'}`:''}`;
 return `<div class="res" style="--c:var(--ink)"><h3><span>${esc(sub.name)}</span><span>정답 ${g.tot}/${g.mc.length}</span></h3>
 <div class="weak">${info}</div><div class="chips">${per}</div>
 ${st?items:`<details><summary>문항별 답안과 해설</summary>${items}</details>`}
 ${mode==='list'?`<button class="home" onclick="copyLink('${sub.rid}',this)">${window.LTApp?'결과 링크 보내기':'결과 링크 복사'}</button>`:''}</div>`;
}
async function copyLink(rid,btn){
 const u=location.origin+location.pathname+'#r='+rid;
 if(window.LTApp){LTApp.share('레벨 테스트 결과예요. 틀린 문제 해설을 꼭 읽어 보세요.\n'+u);return}
 try{await navigator.clipboard.writeText(u);btn.textContent='복사했어요';setTimeout(()=>btn.textContent='결과 링크 복사',2000)}
 catch(e){if(btn.nextElementSibling&&btn.nextElementSibling.tagName==='INPUT')return;const i=document.createElement('input');i.value=u;i.readOnly=true;i.style.marginTop='8px';btn.after(i);i.select()}
}

function noticeTargets(){
 const w=T.data&&T.data.week,seen=new Set(),out=[];
 ((w&&w.subs)||[]).forEach(x=>{const k=x.grade+'|'+x.name;if(!seen.has(k)){seen.add(k);out.push({grade:x.grade,name:x.name})}});
 return out.sort((a,b)=>a.grade-b.grade||a.name.localeCompare(b.name,'ko'));
}
async function noticeSave(){
 const m=document.getElementById('ntc-msg');m.textContent='저장하는 중…';
 try{const r=await postJSON(API+'/notice',{key:T.key,daily:{on:document.getElementById('nd-on').checked,time:document.getElementById('nd-time').value,body:document.getElementById('nd-body').value}});
  if(!r.ok)throw 0;m.textContent=document.getElementById('nd-on').checked?`저장했어요. 매일 ${document.getElementById('nd-time').value}에 알림이 가요.`:'매일 알림을 껐어요.'}
 catch(e){m.textContent='저장하지 못했어요. 시각을 확인하고 다시 눌러 주세요.'}
}

 if(to){push.grade=+g;push.name=nm.join('|')}
 try{const r=await postJSON(API+'/notice',{key:T.key,push});if(!r.ok)throw 0;m.textContent=`${to?push.name+' 학생에게':'모든 학생에게'} 보냈어요. 보통 15분 안에 도착해요(앱을 방금 닫았다면 1분쯤).`}

function teacherView(){
 const d=T.data;
 if(!d.date){$.innerHTML=`<h1 class="jua">채점 화면</h1><p class="lead">아직 만들어진 문제가 없어요.</p>`;return}
 const s=d.sets.find(x=>x.grade===T.tab),subs=d.subs.filter(x=>x.grade===T.tab);
 let body='';
 if(!s)body=`<div class="box"><p class="lead" style="margin:0">${fmt(d.date)} ${T.tab}학년 문제가 없어요.</p></div>`;
 else{
  const gs=subs.map(x=>grade1(x,s.questions));
  const n=s.questions.filter(q=>!q.open).length;
  const avg=gs.length?(gs.reduce((a,g)=>a+g.tot,0)/gs.length).toFixed(1):'-';
  const wrongRate=s.questions.map((q,i)=>({i,q,rate:q.open||!gs.length?-1:gs.filter(g=>!g.rows[i].ok).length/gs.length})).filter(x=>x.rate>0).sort((a,b)=>b.rate-a.rate).slice(0,3);
  body=`<div class="box">
   <div class="row"><b>${T.tab}학년 · 제출 ${subs.length}명</b><span class="pill">평균 정답 ${avg}/${n}</span><span class="pill ${s.released?'on':''}">${s.released?'정답 공개 중':'정답 비공개'}</span></div>
   ${wrongRate.length?`<div class="weak" style="margin-top:8px">많이 틀린 문항: ${wrongRate.map(w=>`${w.i+1}번(${SUBJ[w.q.s].n} ${esc(w.q.unit)}) ${Math.round(w.rate*100)}%`).join(', ')}</div>`:''}
   <button class="rel ${s.released?'off':''}" onclick="release(${!s.released})">${s.released?'공개 취소 (다시 숨기기)':'OK — 학생에게 정답·해설 공개'}</button>
   <div class="weak" style="margin-top:6px">공개하면 ${fmt(d.date)} ${T.tab}학년을 낸 모든 학생이 자기 결과 화면에서 점수·정답·해설을 볼 수 있어요.</div>
  </div>
  <details class="box"><summary>문제와 정답 미리보기 (${s.questions.length}문항)</summary>${s.questions.map((q,i)=>`<div class="wrong"><b>${i+1}번</b> ${SUBJ[q.s].n} · ${esc(q.unit)}${q.passage&&(i===0||s.questions[i-1].passage!==q.passage)?`<div class="psg">${esc(q.passage)}</div>`:'<br>'}${q.fig?`<div class="fig">${q.fig}</div>`:''}${q.script?`<button class="mini" data-s="${esc(q.script)}" onclick="hearText(this.dataset.s)">▶ 들어 보기</button><div class="script">${esc(q.script)}</div>`:''}<span style="white-space:pre-line">${rich(q.q)}</span><br>${q.sudoku?`<div class="row" style="align-items:flex-start;gap:14px"><div><div class="weak">문제</div>${sdkMini(q.sudoku,q.sudoku,null)}</div><div><div class="weak">정답</div>${sdkMini(q.sudoku,q.sol,null)}</div></div>`:q.open?`모범 답안: ${rich(q.model)}`:q.num?`정답(숫자 입력): <b style="color:var(--ok)">${esc(q.ans)}</b>`:q.options.map((o,j)=>`<span style="${j===q.answer?'color:var(--ok);font-weight:700':''}">${'①②③④'[j]} ${rich(o)}</span>`).join('<br>')}<br><span class="weak">${rich(q.exp)}</span></div>`).join('')}</details>
  <h2 class="sec">제출한 학생</h2>
  ${subs.map(x=>card(x,s.questions,'list')).join('')||'<p class="lead">아직 제출한 학생이 없어요.</p>'}`;
 }

async function registerCodes(){
 const lines=document.getElementById('in').value.split(/\s*\n\s*/).filter(Boolean),out=[];
 for(const l of lines){
  let p;try{p=dec(l)}catch(e){out.push(`<div class="weak">읽을 수 없는 코드: ${esc(l.slice(0,20))}…</div>`);continue}
  try{const r=await postJSON(API+'/submit',p);out.push(r.ok?`<div style="color:var(--ok)">${esc(p.name)} (${p.grade}학년 ${fmt(p.setId)}) 등록 완료</div>`:`<div style="color:var(--no)">${esc(p.name||'')} 등록 실패</div>`)}
  catch(e){out.push(`<div style="color:var(--no)">${esc(p.name||'')} 등록 실패 (인터넷 확인)</div>`)}
 }
 document.getElementById('out').innerHTML=out.join('')||'<p class="lead">코드를 붙여넣어 주세요.</p>';
}

 if(!k)return appLogin('주소를 붙여넣어 주세요.');
 try{const r=await getJSON(`${API}/teacher?key=${encodeURIComponent(k)}`);if(r.status===403)return appLogin('채점 주소가 맞지 않아요. 다시 확인해 주세요.');if(!r.ok)throw 0}
 catch(e){return appLogin('인터넷 연결을 확인해 주세요.')}
 store.set('lt_tkey',k);route();
}
function appLogout(){store.set('lt_tkey','');T.key='';appLogin()}
function shareStudent(){
 const t='오늘의 레벨 테스트 (매일 오후 3시 새 문제)\n바로 풀기: '+STUDENT_URL+'\n앱 설치(안드로이드): '+new URL('student-app.html',location.href).href;
 if(window.LTApp)LTApp.share(t);
 else if(navigator.share)navigator.share({text:t}).catch(()=>{});
 else navigator.clipboard?.writeText(t).then(()=>alert('복사했어요. 카카오톡에 붙여넣으세요.')).catch(()=>prompt('주소를 복사하세요',STUDENT_URL));
}

function route(){
 const h=location.hash;scrollTo(0,0);
 if(h==='#app'){const k=store.get('lt_tkey','');T.app=true;if(k){T.key=k;teacherLoad(T.date)}else appLogin();return}
 if(h==='#student'){home();if(T.app)$.insertAdjacentHTML('afterbegin','<button class="home" onclick="location.hash=\'#app\'" style="margin:0 0 8px">← 선생님 화면으로</button>');return}
 if(h==='#demo'){demo();if(T.app)$.insertAdjacentHTML('afterbegin','<button class="home" onclick="location.hash=\'#app\'" style="margin:0 0 8px">← 선생님 화면으로</button>');return}
 if(h==='#teacher')teacherCode();
 else if(h.startsWith('#teacher=')){T.key=decodeURIComponent(h.slice(9));teacherLoad(T.date)}
 else if(h.startsWith('#r='))result(h.slice(3));
 else home();
}
addEventListener('hashchange',route);route();
</script>
