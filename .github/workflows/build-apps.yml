# 선생님 앱(레벨테스트 관리)과 학생 앱(오늘의 레벨 테스트) APK를 만들어 저장소 루트에 올린다.
# android/ 폴더가 바뀌거나 Actions 화면에서 직접 실행할 때 돈다.
# 서명 키는 빌드할 때마다 새로 만든다 → 앱을 새 버전으로 바꿀 때는 기존 앱을 지우고 설치해야 한다.
name: build-apps
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build-apps.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build APKs
        run: |
          set -euo pipefail
          pip install --quiet pillow
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PF=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)/android.jar
          echo "build-tools: $BT"; echo "platform: $PF"
          SITE="https://inaeternum1.github.io/leveltest"
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore ks.p12 -storetype PKCS12 -storepass "$PASS" -keypass "$PASS" \
            -alias lt -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=LevelTest" >/dev/null
          build() {
            local kind=$1 pkg=$2 label=$3 start=$4 reload=$5 vc=$6
            local W=build/$kind
            mkdir -p "$W/classes" "$W/gen" "$W/dex" "$W/res"
            sed -e "s|__PKG__|$pkg|" -e "s|__LABEL__|$label|" android/AndroidManifest.xml > "$W/AndroidManifest.xml"
            local dir="$W/src/$(echo "$pkg" | tr . /)"; mkdir -p "$dir"
            sed -e "s|__PKG__|$pkg|" -e "s|__HOST__|inaeternum1.github.io|" -e "s|__START__|$start|" \
                -e "s|__RELOAD__|$reload|" android/src/MainActivity.java > "$dir/MainActivity.java"
            python3 android/make_icons.py "$kind" "$W/res"
            "$BT/aapt2" compile --dir "$W/res" -o "$W/res.zip"
            "$BT/aapt2" link -I "$PF" --manifest "$W/AndroidManifest.xml" -o "$W/base.apk" "$W/res.zip" --java "$W/gen" \
              --min-sdk-version 24 --target-sdk-version 34 --version-code "$vc" --version-name 2.0 --auto-add-overlay
            javac -encoding UTF-8 --release 11 -cp "$PF" -d "$W/classes" $(find "$W/src" "$W/gen" -name '*.java')
            "$BT/d8" --lib "$PF" --min-api 24 --release --output "$W/dex" $(find "$W/classes" -name '*.class')
            cp "$W/base.apk" "$W/unsigned.apk"
            (cd "$W/dex" && zip -q ../unsigned.apk classes.dex)
            "$BT/zipalign" -p -f 4 "$W/unsigned.apk" "$W/aligned.apk"
            "$BT/apksigner" sign --ks ks.p12 --ks-pass "pass:$PASS" --out "leveltest-$kind.apk" "$W/aligned.apk"
            "$BT/apksigner" verify "leveltest-$kind.apk"
            "$BT/aapt2" dump badging "leveltest-$kind.apk" | grep -E "^package|application-label:"
          }
          build teacher kr.leveltest.teacher "레벨테스트 관리" "$SITE/level-test.html#app" false 10
          build student kr.leveltest.student "오늘의 레벨 테스트" "$SITE/level-test.html" true 10
          rm -rf build ks.p12
          ls -la leveltest-*.apk
      - name: Commit APKs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leveltest-teacher.apk leveltest-student.apk
          git commit -m "build: update app APKs [skip ci]" || echo "nothing to commit"
          git push
